name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/user/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Add the user guide to the site
        run: |
          cp -r docs/user site/guide
          find site/guide -name README.md | while read -r f; do mv "$f" "$(dirname "$f")/index.md"; done
          find site/guide -name '*.md' -exec sed -i 's/README\.md/index.md/g' {} +
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v4

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
